# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# onionscan measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Nothing here reaches the network. A scan needs Tor and a live onion
# service, so its success path is not measured (see bench/README.md); what is
# measured is the scan history on disk, which `onionscan compare` reads, and
# the paths that fail before Tor is started. The history is generated by
# gen.sh before measuring; both revisions run the working tree's gen.sh
# (${head_root}), so they read the same data.
version: "1"

name: onionscan
description: Start-up, comparing two stored scans of 10 and 100 000 findings in each report format, and the error paths of compare and scan.

build:
  command: [go, build, -trimpath, -o, "${artifact}", ./cmd/onionscan]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  # onionscan keeps its scan history under XDG_DATA_HOME and looks for
  # .onionscan in the working directory and HOME; keep all of them in the
  # benchmark's own directory.
  cwd: "${workdir}"
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
    XDG_DATA_HOME: "${workdir}/data"
    XDG_CACHE_HOME: "${workdir}/.cache"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting onionscan and exiting.
    tags: [smoke]
    commands:
      onionscan:
        command: ["${artifact}", version]

  - name: compare 10
    description: >-
      The two latest scans of a service with 10 findings each, compared and
      written as text, JSON and Markdown. Start-up and opening the database
      dominate.
    tags: [smoke]
    setup:
      # gen.sh builds its generator with go run. The env of defaults reaches
      # hooks too, and with HOME in ${workdir} Go would download every module
      # into a fresh GOPATH there; give the hook the user's own Go caches.
      - command: [sh, "${head_root}/gen.sh", db, "10", "${workdir}/data/onionscan"]
        env: &goenv
          HOME: "${env:HOME}"
          XDG_CONFIG_HOME: ""
          XDG_CACHE_HOME: ""
          XDG_DATA_HOME: ""
    baseline: text
    commands:
      text:
        command: ["${artifact}", compare, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]
      json:
        command: ["${artifact}", compare, --json, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]
      markdown:
        command: ["${artifact}", compare, --markdown, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]

  - name: compare 100k
    description: >-
      The two latest scans of a service with 100 000 findings each (one in
      ten new, one in ten resolved): reading and decoding both reports from
      SQLite, matching the findings, and writing each format.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", db, "100000", "${workdir}/data/onionscan"]
        env: *goenv
    baseline: text
    metrics:
      throughput:
        work: {value: 200000, unit: findings}
    commands:
      text:
        command: ["${artifact}", compare, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]
      json:
        command: ["${artifact}", compare, --json, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]
      markdown:
        command: ["${artifact}", compare, --markdown, n5xgs33oonrwc3ranbuw233snfwwkidcmvxgg2dnmfzgwidlmv4twaad.onion]

  - name: compare error
    description: Comparing a service the history does not have, which opens the database and fails with exit 1.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", db, "10", "${workdir}/data/onionscan"]
        env: *goenv
    exit_codes: [1]
    commands:
      onionscan:
        command: ["${artifact}", compare, meqhgzlsozuwgzjao5uxi2banzxsa43dmfxca2djon2g64tzeeqs5kyd.onion]

  - name: scan error
    description: >-
      A scan of an address that is not a v3 onion address: the flags and the
      configuration are read and the database is opened, and the scan fails
      with exit 1 before Tor is started.
    tags: [smoke]
    exit_codes: [1]
    commands:
      onionscan:
        command: ["${artifact}", scan, not-an-onion-address]
