name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit, so
# superseded runs do not hold the account's shared job slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# onionscan is measured end to end with himorime, from bench/himorime.yaml.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds it and the head with the same Go, and
# measures both in interleaved rounds on this runner, so a noisy neighbour
# slows both revisions instead of one. The job fails when the head is slower,
# uses more CPU time or more memory than the base beyond the tolerance of the
# suite with 95% confidence; a difference too close to call is inconclusive
# and does not fail it. The comparison is written to the job summary.
#
# Started by hand, the job measures the ref it runs on without comparing.
#
# The suite is split over four jobs so the run takes as long as its slowest
# part instead of the sum: each format of "compare 100k" reads and writes two
# scans of 100 000 findings for about 70 seconds per revision, and every
# other benchmark fits in the fourth job. That job selects whatever the first
# three do not, from `himorime list`, so a benchmark added to the suite is
# never left out.
jobs:
  bench:
    name: bench (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # setup-himorime posts the problems it finds as a PR comment.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: compare 100k text
            filter: '^compare 100k text$'
          - name: compare 100k json
            filter: '^compare 100k json$'
          - name: compare 100k markdown
            filter: '^compare 100k markdown$'
          - name: the rest
            filter: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: nao1215/setup-himorime@05b4d293796e34a46c59f1363e15841a18e83e92 # v0.2.1
        with:
          version: v0.6.1
      - name: Select the benchmarks of this job
        id: select
        env:
          FILTER: ${{ matrix.shard.filter }}
        # The last job takes every benchmark the others do not; keep the
        # names below in step with the filters of the matrix.
        run: |
          if [ -z "$FILTER" ]; then
            FILTER=$(himorime list --format json bench | jq -r '
              [.[].benchmark] | unique
              | map(select(startswith("compare 100k ") | not))
              | map("^" + gsub("(?<c>[.*+?()\\[\\]{}|^$\\\\])"; "\\\(.c)") + "$")
              | join("|")')
          fi
          echo "Benchmarks: $FILTER"
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
      - name: Compare the base with the head
        if: github.event_name == 'pull_request'
        env:
          FILTER: ${{ steps.select.outputs.filter }}
        run: himorime ci --filter "$FILTER" --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request'
        env:
          FILTER: ${{ steps.select.outputs.filter }}
        run: himorime run --filter "$FILTER" --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: himorime-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
