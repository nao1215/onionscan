name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit test (linux)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # The floor go.mod declares and the newest release. Running the floor
        # here is the only place that go.mod claim is checked; before this there
        # was only the floor, so nothing caught a new Go release breaking the
        # tree. "stable" tracks each release without an edit, and is used rather
        # than "1" because setup-go resolves "1" from its own manifest, which
        # lags a fresh release. Every other workflow uses "stable" too: go.mod
        # states the oldest Go a user may build from, not the toolchain CI
        # should ship release artifacts with.
        go:
          - "1.26.9"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit tests with coverage report output
        run: go test -short -cover -coverpkg=./... -coverprofile=coverage.out ./...
