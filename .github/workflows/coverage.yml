name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  coverage:
    name: Coverage (unit + atago E2E)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      - name: Install Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor

      - name: Install atago
        uses: nao1215/setup-atago@7cae89595fcbba334db0fe16fc9a24ed5b0a3fea # v0.1.2
        with:
          version: v0.22.0

      - name: Run combined unit and E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@v1
        with:
          config: .octocov.yml
          work-dir: .
          args: --report=coverage.out
